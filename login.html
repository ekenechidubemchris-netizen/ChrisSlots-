<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — ChrisSlots</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="site-header"></div>

<main class="auth-wrap">
  <div class="auth-card">
    <h1 class="center" style="margin-bottom:6px">Welcome back</h1>
    <p class="center muted" style="margin-bottom:24px">Log in to manage your bookings.</p>
    <form onsubmit="return doLogin(event)">
      <div class="form-group"><label>Email</label><input id="li-email" type="email" required value="demo@chrisslots.com"></div>
      <div class="form-group"><label>Password</label><input id="li-password" type="password" required value="demo1234"></div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p class="hint center" style="margin-top:14px">Demo account is pre-filled — just press Log in.</p>
    <p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/booking.js"></script>
<script src="js/app.js"></script>
<script>
function doLogin(e) {
  e.preventDefault();
  const res = Auth.login({ email: document.getElementById("li-email").value.trim(), password: document.getElementById("li-password").value });
  if (!res.ok) { App.toast(res.error); return false; }
  App.toast(`Welcome back, ${res.user.name.split(" ")[0]}!`);
  const redirect = App.qs("redirect");
  setTimeout(() => location.href = redirect || "dashboard.html", 500);
  return false;
}
</script>
</body>
</html>
