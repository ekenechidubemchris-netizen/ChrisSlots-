<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore — ChrisSlots</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="site-header"></div>

<header class="page-hero">
  <div class="container">
    <h1 id="listing-heading">Explore</h1>
    <p>Compare options and reserve in a few taps.</p>
  </div>
</header>

<main class="section">
  <div class="container">
    <div class="search-tabs" id="type-tabs" style="margin-bottom:24px"></div>

    <div class="listing-layout">
      <aside class="filters-panel" id="filters-panel"></aside>

      <div>
        <div class="results-toolbar">
          <span class="results-count" id="results-count"></span>
          <select class="sort-select" onchange="Search.setSort(this.value)">
            <option value="">Sort: Recommended</option>
            <option value="price-asc">Price: Low to high</option>
            <option value="price-desc">Price: High to low</option>
            <option value="rating">Highest rated</option>
          </select>
        </div>
        <div id="results-grid" class="grid"></div>
      </div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/booking.js"></script>
<script src="js/app.js"></script>
<script src="js/search.js"></script>
<script>document.addEventListener("DOMContentLoaded", Search.init);</script>
</body>
</html>
